server.port=${PORT:8080}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
taskgo.cors.allowed-origins=${TASKGO_CORS_ALLOWED_ORIGINS}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
logging.level.root=INFO

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:none}

# Configure estas integrações somente ao habilitar os recursos correspondentes.
taskgo.payments.enabled=${PAYMENTS_ENABLED:false}
taskgo.payments.provider=${PAYMENTS_PROVIDER:mercadopago}
taskgo.payments.mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:}
taskgo.payments.mercadopago.webhook-secret=${MERCADOPAGO_WEBHOOK_SECRET:}
taskgo.payments.public-base-url=${PAYMENTS_PUBLIC_BASE_URL:}

spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS_REQUIRED:true}
taskgo.mail.from=${SMTP_FROM:}
taskgo.auth.password-reset.frontend-url=${PASSWORD_RESET_FRONTEND_URL:}
