# Desenvolvimento local. DB_PASSWORD continua obrigatória para evitar credenciais padrão.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/taskgo_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
taskgo.cors.allowed-origins=${TASKGO_CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
