# Ambiente completo de desenvolvimento: banco, API e site.
# Use .\iniciar.ps1 (ou: docker compose up -d --build) e abra http://localhost:3000
# Só o site fica exposto, e só nesta máquina. Banco e API ficam na rede interna do Docker.
name: taskgo

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: taskgo_db
      POSTGRES_USER: taskgo_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env (o iniciar.ps1 cria um para você)}
    volumes:
      - dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskgo_app -d taskgo_db"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://db:5432/taskgo_db
      DB_USERNAME: taskgo_app
      DB_PASSWORD: ${DB_PASSWORD}
      # O site e a API chegam ao navegador pelo mesmo endereço (proxy do serviço web).
      TASKGO_CORS_ALLOWED_ORIGINS: http://localhost:3000
      SESSION_COOKIE_SECURE: "false"
      SESSION_COOKIE_SAME_SITE: lax
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:3000:80"
    # Só os arquivos do site; .env, backend e .git ficam fora do servidor.
    # As pastas são montadas direto do projeto: editou, é só recarregar a página.
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./favicon.svg:/usr/share/nginx/html/favicon.svg:ro
      - ./css:/usr/share/nginx/html/css:ro
      - ./js:/usr/share/nginx/html/js:ro
      - ./assets:/usr/share/nginx/html/assets:ro

volumes:
  dados:
    # Mesmo volume do roteiro antigo do README: os dados já cadastrados continuam.
    name: taskgo-dev-db
