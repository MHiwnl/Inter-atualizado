services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: taskgo_db
      POSTGRES_USER: taskgo_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no ambiente}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - taskgo-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskgo_app -d taskgo_db"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  taskgo-postgres:
